name: macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Bundle
        run: npm run bundle:mac
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Onus-Audio-mac
          path: release/Onus-Audio-mac.zip
          if-no-files-found: error
